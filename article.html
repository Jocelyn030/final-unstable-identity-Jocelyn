      dreaming: {
  title: "Dreaming",
  paras: [

`No one saw him disembark in the unanimous night. The taciturn man arrived at the ruined temple with a single purpose: he knew that his immediate obligation was to dream.`,

`He wanted to dream a man into existence. This magical project exhausted his entire mind; he sought a soul worthy of participating in the universe.`,

`At first, his dreams were chaotic; then in a short while they became ordered and deliberate. He dismissed the illusory multitude and kept only one pupil, shaping him with patience and precision.`,

`Night after night he dreamed the young man into being — the heart, the organs, the eyelids, the innumerable hair — until the dreamed body lay complete, asleep within reality.`,

`The god of Fire revealed that the phantom would live as a real man, believed by all creatures. Only Fire and the dreamer would know his true nature.`,

`With relief, with humiliation, with terror, he understood that he himself was also an illusion — that someone else was dreaming him.`

  ]
},
      creates: {
  title: "Creates",
  paras: [

`In The Circular Ruins, creation begins in the mind. The dreamer constructs a human being piece by piece, revealing that identity is assembled through intention and perception rather than born complete.`,

`In The Garden of Forking Paths, every decision generates diverging futures. Time does not flow in a single line; each choice creates simultaneous realities.`,

`In The Book of Sand, the infinite book resists boundaries and order. Its endless pages create a structure beyond comprehension, exposing the limits of human understanding.`,

`Creation is not limited to making objects. It produces realities, possibilities, and structures through which existence is understood.`

  ]
},
      ffire: {
  title: "Fire",
  paras: [

`Fire functions not as destruction but as revelation. It distinguishes what is constructed from what is believed to be real.`,

`The dreamer later walks into the flames and feels no pain. In that moment, he understands the truth: he too is a projection within another dream.`,

`Fire does not annihilate existence; it exposes its hidden structure.`

  ]
},
      illusion: {
  title: "Illusion",
  paras: [

`Illusion does not simply deceive; it reveals that stability itself may be a construct of perception.`,
